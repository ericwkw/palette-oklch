<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palette — OKLCH ramp studio</title>
<style>
  :root{
    color-scheme:light;
    --bg:#F7F8FA; --panel:#FFFFFF; --ink:#141A21; --ink-2:#5A6673; --ink-3:#8A94A0; --line:#DFE4EA;
    --accent:#2563EB; --ok:#15803D; --bad:#B91C1C; --warn:#A16207;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --rail:340px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-ui="light"]){--bg:#0D1117;--panel:#151B23;--ink:#E7ECF2;--ink-2:#9BA6B2;--ink-3:#6B7683;--line:#232C36;--accent:#6EA8FF}
  }
  :root[data-ui="dark"]{--bg:#0D1117;--panel:#151B23;--ink:#E7ECF2;--ink-2:#9BA6B2;--ink-3:#6B7683;--line:#232C36;--accent:#6EA8FF}
  :root[data-ui="dark"] .sw{border-color:rgba(255,255,255,.08)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
  h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
  button,input,select{font:inherit;color:inherit}
  code,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  .app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
  .rail{border-right:1px solid var(--line);background:var(--panel);padding:20px 18px 40px;position:sticky;top:0;height:100vh;overflow:auto}
  .main{padding:22px clamp(16px,3vw,36px) 80px;min-width:0}

  .brand{display:flex;align-items:baseline;gap:9px;margin-bottom:4px}
  .brand h1{font-size:1.05rem}
  .brand span{font-size:.72rem;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
  .rail p.sub{margin:0 0 18px;color:var(--ink-2);font-size:.82rem;line-height:1.5}

  fieldset{border:0;border-top:1px solid var(--line);margin:0 0 14px;padding:14px 0 0}
  legend{padding:0;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .row{display:grid;grid-template-columns:5.6em minmax(0,1fr) 3.6em;gap:8px;align-items:center;margin:9px 0}
  .row label{font-size:.8rem;color:var(--ink-2)}
  .row input[type=range]{width:100%;accent-color:var(--accent)}
  .row output{font-family:var(--mono);font-size:.74rem;color:var(--ink-2);text-align:right}
  .row .chip{width:100%;height:26px;border-radius:6px;border:1px solid var(--line)}
  .field{display:grid;grid-template-columns:5.6em minmax(0,1fr);gap:8px;align-items:center;margin:9px 0}
  .field input[type=text],.field input[type=number],.field select{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:.82rem}
  .btn{
    appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;
    padding:8px 14px;font-size:.8rem;font-weight:600;cursor:pointer}
  .btn:hover{border-color:var(--ink-3)}
  .btn.primary{background:var(--accent);border-color:transparent;color:#fff}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;position:sticky;top:0;background:var(--bg);padding:6px 0 10px;z-index:5}
  .tabs button{
    appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;
    padding:8px 15px;font-size:.82rem;font-weight:600;color:var(--ink-2);cursor:pointer}
  .tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:transparent}
  .seg{display:flex;gap:2px;padding:3px;border:1px solid var(--line);background:var(--panel);border-radius:999px}
  .seg button{appearance:none;border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:.78rem;font-weight:600;color:var(--ink-2);cursor:pointer}
  .seg button[aria-selected=true]{background:var(--ink);color:var(--bg)}
  .chip{width:100%;height:30px;border-radius:7px;border:1px solid var(--line);margin:2px 0 8px}
  .anchor{display:flex;align-items:center;gap:8px;margin:2px 0 8px;font-size:.72rem;color:var(--ink-2)}
  .anchor .pair{display:flex;border-radius:6px;overflow:hidden;border:1px solid var(--line);flex:0 0 70px;height:22px}
  .anchor .pair span{flex:1}
  .anchor b{font-weight:600;color:var(--ink)}
  .btn.mini{padding:3px 8px;font-size:.7rem;border-radius:999px;line-height:1.3}
  .anchor .btn.mini{flex:0 0 auto}
  .check{display:flex;align-items:center;gap:7px;font-size:.74rem;color:var(--ink-2);margin:0 0 10px;cursor:pointer}
  .check input{accent-color:var(--accent)}
  .sw.is-brand{box-shadow:inset 0 0 0 2px var(--ink),0 0 0 2px var(--panel)}
  .sw.is-brand b::after{content:" · brand";font-weight:600}
  .sw.is-nudged{outline:2px dashed rgba(0,0,0,.35);outline-offset:-4px}
  .sw{transition:transform .12s ease}
  .sw:hover{transform:translateY(-2px)}
  .editor{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg)}
  .editor .top{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .editor .top b{font-size:.82rem}
  .editor .sample{width:46px;height:26px;border-radius:6px;border:1px solid var(--line)}
  .editor .row{grid-template-columns:5.6em minmax(0,1fr) 4.4em}
  section.view{display:none}
  section.view.on{display:block}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin:0 0 6px}
  .head h2{font-size:1rem}
  .note{color:var(--ink-2);font-size:.82rem;line-height:1.55;max-width:78ch;margin:0 0 18px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 16px}
  .card > h3{font-size:.86rem;margin-bottom:10px}
  .card.dark-card{background:#12161C;border-color:#222A34;color:#E7ECF2}
  .card.dark-card .cap{color:#8A94A0}
  .card.dark-card .steps-head{color:#6B7683}
  .card .cap{font-size:.76rem;color:var(--ink-3);margin:0 0 12px}

  /* ramps */
  .ramp{display:grid;grid-template-columns:8.5em repeat(11,minmax(0,1fr));gap:4px;align-items:stretch;margin:0 0 8px}
  .ramp .name{display:flex;flex-direction:column;justify-content:center;font-size:.8rem;font-weight:600}
  .ramp .name small{font-weight:400;color:var(--ink-3);font-size:.7rem}
  .sw{border-radius:8px;border:1px solid rgba(0,0,0,.06);min-height:62px;padding:6px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
  .sw b{font-size:.66rem;font-weight:600;opacity:.75}
  .sw span{font-family:var(--mono);font-size:.6rem;opacity:.7;word-break:break-all}
  .steps-head{display:grid;grid-template-columns:8.5em repeat(11,minmax(0,1fr));gap:4px;margin-bottom:6px;font-size:.66rem;color:var(--ink-3);font-family:var(--mono)}
  .steps-head span{text-align:center}

  table{width:100%;border-collapse:collapse;font-size:.8rem}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:600}
  .pass{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
  .fail{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
  .mid{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
  .dot{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid rgba(0,0,0,.12);vertical-align:-1px;margin-right:6px}

  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .share{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line);margin:6px 0 10px}
  .share span{display:block}
  .legend{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:.76rem;color:var(--ink-2)}
  .legend b{font-weight:600;color:var(--ink)}

  .alpha-grid{display:grid;gap:4px;margin-top:8px}
  .alpha-cell{min-height:44px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.64rem;font-family:var(--mono)}
  .checker{background-image:linear-gradient(45deg,#00000010 25%,transparent 25%,transparent 75%,#00000010 75%),linear-gradient(45deg,#00000010 25%,transparent 25%,transparent 75%,#00000010 75%);background-size:16px 16px;background-position:0 0,8px 8px}

  .grad{height:110px;border-radius:10px;border:1px solid var(--line);margin-bottom:8px;position:relative;overflow:hidden}
  .grad em{position:absolute;left:10px;bottom:8px;font-style:normal;font-size:.7rem;background:rgba(0,0,0,.5);color:#fff;padding:3px 8px;border-radius:999px}
  pre{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:.74rem;line-height:1.5;max-height:420px}

  .preview{border-radius:12px;border:1px solid var(--line);overflow:hidden;font-size:13px;line-height:1.45}
  .pv-bar{display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:.78rem}
  .pv-body{padding:18px 16px 20px;display:grid;gap:12px}
  .pv-card{border-radius:10px;padding:14px;display:grid;gap:8px}
  .pv-btn{display:inline-block;border-radius:8px;padding:8px 14px;font-size:.78rem;font-weight:600}
  .pv-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  /* the dense app screen */
  .pv-app{display:grid;grid-template-columns:148px 1fr;min-height:520px}
  .pv-side{padding:14px 10px;display:flex;flex-direction:column;gap:2px;font-size:.76rem}
  .pv-side .pv-brand{display:flex;align-items:center;gap:7px;font-weight:700;padding:2px 8px 12px}
  .pv-nav{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px}
  .pv-main{padding:16px 16px 20px;display:grid;gap:14px;align-content:start;min-width:0}
  .pv-h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
  .pv-h2{font-size:15px;font-weight:650;margin:0}
  .pv-p{font-size:13px;margin:0}
  .pv-small{font-size:11px;margin:0}
  .pv-panel{border-radius:10px;padding:12px;display:grid;gap:10px;min-width:0}
  .pv-table{width:100%;border-collapse:collapse;font-size:12px}
  .pv-table th{text-align:left;font-weight:600;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:0 8px 7px}
  .pv-table td{padding:7px 8px;border-top-width:1px;border-top-style:solid}
  .pv-pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:600;border-width:1px;border-style:solid}
  .pv-pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
  .pv-field{display:grid;gap:4px;font-size:11.5px}
  .pv-input{border-radius:7px;padding:7px 9px;border-width:1px;border-style:solid;font-size:12px}
  .pv-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .pv-chart{display:flex;align-items:flex-end;gap:8px;height:104px;padding-top:4px}
  .pv-chart span{flex:1;border-radius:4px 4px 0 0;min-height:4px}
  .pv-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10.5px}
  .pv-legend b{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
  @media (max-width:720px){ .pv-app{grid-template-columns:1fr} .pv-cols{grid-template-columns:1fr} }
  .swatch-inline{display:inline-flex;align-items:center;gap:7px;font-size:.76rem;color:var(--ink-2)}
  .shot{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);max-width:520px;user-select:none;touch-action:none}
  .shot img{display:block;width:100%}
  .region{position:absolute;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.55),0 0 0 9999px rgba(0,0,0,.28);cursor:move;border-radius:3px}
  .region .grip{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;border-radius:3px;background:#fff;border:1px solid rgba(0,0,0,.5);cursor:nwse-resize}
  .region .cap-demo{position:absolute;left:6px;bottom:5px;right:6px;color:#fff;font-size:.8rem;font-weight:600;pointer-events:none}
  .term{border:1px solid var(--line);background:var(--bg);color:var(--ink-3);width:16px;height:16px;border-radius:50%;
    font-size:.62rem;line-height:1;padding:0;cursor:pointer;vertical-align:middle;margin-left:4px}
  .term:hover{border-color:var(--ink-3);color:var(--ink)}
  #btnGloss{border:1px solid var(--line);background:var(--panel);color:var(--ink-2);border-radius:999px;
    padding:7px 14px;font-size:.78rem;font-weight:600;cursor:pointer}
  #btnGloss:hover{border-color:var(--ink-3);color:var(--ink)}
  dialog#gloss{border:1px solid var(--line);border-radius:14px;padding:22px 24px;max-width:640px;width:calc(100% - 32px);
    background:var(--panel);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.28)}
  dialog#gloss::backdrop{background:rgba(10,14,20,.44)}
  .gloss-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:6px}
  .gloss-head h2{margin:0;font-size:1.05rem}
  #glossList{margin:0}
  #glossList dt{font-weight:650;font-size:.86rem;margin-top:14px}
  #glossList dt span{font-weight:400;color:var(--ink-3);font-size:.76rem;margin-left:6px}
  #glossList dd{margin:3px 0 0;color:var(--ink-2);font-size:.82rem;line-height:1.55}
  #glossList div.lit{background:var(--bg);border-radius:8px;padding:6px 10px;margin:0 -10px}
  .func-ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:7px}
  .func-ctl label{display:inline-flex;align-items:center;gap:7px;font-size:.72rem;color:var(--ink-3)}
  .func-ctl input[type=range]{width:104px}
  .func-ctl output{font-family:var(--mono);font-size:.7rem;color:var(--ink-2);min-width:2.6em}
  tr.row-fail td{background:color-mix(in oklab, #d4423a 7%, transparent)}
  .cap.fail-cap{color:#b83029}
  kbd{font-family:var(--mono);font-size:.68rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--bg)}
  .btn[disabled]{opacity:.42;cursor:default}
  .btn.danger{border-color:#d4423a;color:#d4423a}
  .muted{color:var(--ink-3)}
  .hint{font-size:.74rem;color:var(--ink-3);margin-top:6px}
  @media (max-width:980px){ .app{grid-template-columns:1fr} .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)} }
</style>
</head>
